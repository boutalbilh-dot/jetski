name: projet_jetski
description: Real-time depth display & shallow-water alerts for jetskis
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  flutter_blue_plus: ^1.32.0
  flutter_bluetooth_serial: ^0.4.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  vibration: ^2.0.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
